# <your-domain.com> env var placeholders must be set before deployment
# <your-domain.com> cert paths below are placeholders; /metrics must stay restricted to internal scrapers (allow 127.0.0.1 only).
server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # H30: pin modern TLS and force HTTPS for future visits.
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # L49: a location block with ANY proxy_set_header stops inheriting the
        # server-level ones — without these the upstream saw Host:
        # 127.0.0.1:8000 and no client address, breaking origin checks and
        # per-IP accounting for WebSocket clients.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # L36: /metrics is gated TWICE — network-level here (loopback-only
    # allowlist) and, when METRICS_SECRET is set, app-level via the
    # X-Metrics-Secret header (H19). Both layers are intentional defense in
    # depth: the allowlist survives an app misconfiguration, and the header
    # gate protects the endpoint if the API is ever exposed without this
    # nginx config in front of it.
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }
}
